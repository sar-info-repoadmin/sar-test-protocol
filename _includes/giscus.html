<section class="discussion" aria-labelledby="discussion-heading">
  <h2 id="discussion-heading">Discussion &amp; proposed changes</h2>
  <p class="discussion-hint">Comment below to discuss this criterion or propose a change to the standard. Sign in with GitHub to post — replies are threaded and mirrored to <a href="https://github.com/{{ site.repository }}/discussions">GitHub Discussions</a>.</p>
  <script src="https://giscus.app/client.js"
    data-repo="{{ site.repository }}"
    data-repo-id=""
    data-category="Criteria Discussion"
    data-category-id=""
    data-mapping="pathname"
    data-strict="1"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="preferred_color_scheme"
    data-lang="en"
    crossorigin="anonymous"
    async>
  </script>
</section>
